name: Deploy Here News to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuild so expired ad campaigns drop out of the pages
  # (start/end dates are also applied in the browser by assets/ads.js).
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the notify step can see which stories changed.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        # Exact versions from package-lock.json, so a new release of a build
        # tool can't break deploys without a change here.
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      # GitHub sometimes can't find the just-uploaded site for a moment
      # ("No artifacts named github-pages were found"). If the deploy fails,
      # wait and try once more in the same run (re-running the whole job would
      # upload a second copy and fail with "Multiple artifacts" instead).
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Tell search engines about new and updated stories
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # Public by design: the same key is served at /<key>.txt.
          INDEXNOW_KEY: b1d17cb8aa035d71d981828fad0e5fa2
        run: node scripts/notify-search-engines.mjs
